[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}]
libs = ["lib"]
out = "out"
solc_version = "0.8.30"
src = "src"
via_ir = true
optimizer = true
optimizer_runs = 200

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false

[rpc_endpoints]
# Public endpoints. Foundry does NOT support ${VAR:-default} here, so these are
# literal; point them at a private provider by editing this block if rate-limited.
base_sepolia = "https://sepolia.base.org"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
unichain_sepolia = "https://sepolia.unichain.org"
# Ethereum Sepolia: canonical v4 core plus live Chainlink FX feeds (FX fork test).
eth_sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
# Ethereum mainnet: read-only source for the Arc testnet FX feed mirror.
eth_mainnet = "https://ethereum-rpc.publicnode.com"
# Circle Arc. Gas is USDC; fund the deployer at https://faucet.circle.com.
arc_testnet = "https://rpc.testnet.arc.io"
